# Publish kellypage.app: the site files plus the current Kelly Page release (from latest.json) unzipped into app/.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the current Kelly Page release in app/
        run: |
          set -euo pipefail
          zip_url=$(python3 -c "import json; print(json.load(open('latest.json'))['files']['zip'])")
          want=$(python3 -c "import json; print(json.load(open('latest.json'))['sha256'])")
          curl -fsSL "$zip_url" -o kelly.zip
          echo "$want  kelly.zip" | sha256sum -c -
          rm -rf app && mkdir -p _z && unzip -q kelly.zip -d _z && mv "_z/Kelly Page" app && rm -rf _z kelly.zip
          mkdir -p _site && cp -r *.html *.json *.txt *.xml _headers css js assets guides app _site/
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=kellypage --branch=main --commit-dirty=true
